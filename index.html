    <style>
        /* Estilos CSS Personalizados */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            transition: background-color 0.3s, color 0.3s;
        }
        
        /* Estilos del editor de informe (contenteditable) */
        .report-editor {
            min-height: 250px;
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #e5e7eb; /* Gris claro */
            transition: all 0.2s;
            white-space: pre-wrap; /* Mantiene saltos de línea y espacios */
        }
        
        .dark .report-editor {
            border: 1px solid #4b5563; /* Gris oscuro */
            background-color: #1f2937; /* Fondo más oscuro */
        }

        /* Estilo para el placeholder del editor */
        .report-editor:empty:before {
            content: attr(data-placeholder);
            color: #9ca3af; /* Gris medio */
        }

        /* Animación de carga */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }

        /* Clases de modo oscuro */
        .dark body { background-color: #111827; color: #f9fafb; }
        .dark .bg-white { background-color: #1f2937 !important; }
        .dark .text-gray-900 { color: #f9fafb !important; }
        .dark .text-gray-600 { color: #d1d5db !important; }
        .dark .border-gray-200 { border-color: #374151 !important; }
        .dark .bg-gray-50 { background-color: #1f2937 !important; }
        .dark input, .dark textarea, .dark select { 
            background-color: #111827 !important; 
            border-color: #4b5563 !important;

<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300">

    <div id="loading-overlay" class="fixed inset-0 bg-gray-900 bg-opacity-75 z-50 hidden flex items-center justify-center">
        <div class="flex flex-col items-center">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500"></div>
            <p class="mt-4 text-white text-lg">Analizando imagen con IA...</p>
        </div>
    </div>

    <div id="camera-modal" class="fixed inset-0 bg-gray-900 bg-opacity-95 z-40 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-lg p-6">
            <h3 class="text-xl font-semibold mb-4 text-gray-900 dark:text-white">Capturar Imagen Colposcópica</h3>
            <video id="video-stream" class="w-full h-auto rounded-lg mb-4" autoplay></video>
            <div class="flex justify-between">
                <button id="capture-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-150">Capturar</button>
                <button id="close-camera-btn" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg transition duration-150">Cerrar</button>
            </div>
        </div>
    </div>

    <div id="message-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 z-40 hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-xl w-full max-w-sm p-6">
            <h3 id="modal-title" class="text-xl font-semibold mb-4 text-gray-900 dark:text-white"></h3>
            <p id="modal-message" class="text-gray-600 dark:text-gray-300 mb-6"></p>
            <div class="flex justify-end">
                <button id="close-modal-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition duration-150">Aceptar</button>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
        <header class="flex justify-between items-center pb-4 border-b border-gray-200 dark:border-gray-700 mb-6">
            <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white">ColpoVision AI 🩺</h1>
            <button id="theme-toggle" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 hover:ring-2 hover:ring-blue-500 transition duration-150" aria-label="Toggle Dark Mode">
                <svg id="sun-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 01-8 0 4 4 0 018 0z"></path></svg>
                <svg id="moon-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </header>

        <div id="patient-list-screen" class="space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <input type="text" id="search-input" placeholder="Buscar por Nombre o ID..." class="flex-grow p-3 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 focus:ring-blue-500 focus:border-blue-500 transition duration-150">
                <button id="new-patient-btn" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-md transition duration-150 flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Añadir Nueva Paciente
                </button>
            </div>

            <div id="patient-list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                </div>
            
            <p id="no-patients-message" class="text-center text-gray-500 dark:text-gray-400 hidden">Aún no hay pacientes guardados.</p>
        </div>

        <div id="patient-form-screen" class="hidden max-w-3xl mx-auto bg-white dark:bg-gray-800 p-6 rounded-lg shadow-xl">
            <h2 id="form-title" class="text-2xl font-bold mb-6 text-gray-900 dark:text-white">Nueva Paciente</h2>
            <form id="patient-form" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Nombre Completo</label>
                        <input type="text" id="name" name="name" required class="mt-1 block w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="id" class="block text-sm font-medium text-gray-700 dark:text-gray-300">ID / Historia Clínica</label>
                        <input type="text" id="id" name="id" required class="mt-1 block w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
                
                <div>
                    <label for="history" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Historial Médico Relevante</label>
                    <textarea id="history" name="history" rows="4" class="mt-1 block w-full p-3 border border-gray-300 dark:border-gray-600 rounded-lg dark:bg-gray-700 focus:ring-blue-500 focus:border-blue-500" placeholder="Ej: FUP, gestaciones, tratamientos previos, síntomas."></textarea>
                </div>

                <div class="space-y-4">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Imagen Colposcópica</label>
                    <div class="flex flex-col sm:flex-row gap-4">
                        <input type="file" id="image-file-input" accept="image/*" class="hidden">
                        <button type="button" id="upload-btn" class="flex-1 bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 font-bold py-2 px-4 rounded-lg transition duration-150 flex items-center justify-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            Subir Archivo
                        </button>
                        <button type="button" id="camera-btn" class="flex-1 bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 font-bold py-2 px-4 rounded-lg transition duration-150 flex items-center justify-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.218A2 2 0 0110.439 4h3.122a2 2 0 011.664.89l.812 1.218A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                            Abrir Cámara
                        </button>
                    </div>
                    <img id="image-preview" class="w-40 h-auto object-cover rounded-lg shadow-md mt-2 hidden" alt="Vista previa de la imagen">
                </div>

                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">Firma del Médico (Opcional)</label>
                    <input type="file" id="signature-file-input" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 dark:file:bg-blue-900 dark:file:text-blue-200 dark:hover:file:bg-blue-800 transition duration-150">
                    <img id="signature-preview" class="w-40 h-auto object-cover rounded-lg shadow-md mt-2 hidden" alt="Vista previa de la firma">
                </div>

                <div class="flex justify-end space-x-4 pt-4">
                    <button type="button" id="cancel-form-btn" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-150">Cancelar</button>
                    <button type="button" id="save-patient-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-150">Guardar Paciente</button>
                    <button type="button" id="analyze-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-150 hidden">Analizar con IA</button>
                </div>
            </form>
        </div>

        <div id="report-screen" class="hidden max-w-4xl mx-auto bg-white dark:bg-gray-800 p-6 rounded-lg shadow-xl">
            <h2 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white">Informe Colposcópico Generado</h2>
            
            <div id="report-patient-info" class="mb-4 p-4 border border-gray-200 dark:border-gray-700 rounded-lg text-sm text-gray-700 dark:text-gray-300">
                </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="md:col-span-1">
                    <img id="report-image" class="w-full h-auto object-cover rounded-lg shadow-md" alt="Imagen colposcópica">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Informe AI (Editable)</label>
                    <div id="report-editor" class="report-editor bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white" 
                         contenteditable="true" data-placeholder="Edita o verifica el informe generado por la IA aquí...">
                    </div>
                </div>
            </div>

            <div class="flex justify-end space-x-4">
                <button id="back-to-list-btn" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-150">Volver a la Lista</button>
                <button id="export-pdf-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition duration-150 flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Exportar a PDF
                </button>
            </div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        // Inicialización de jsPDF
        const { jsPDF } = window.jspdf;

        // --- Variables Globales ---
        let patients = [];
        let editingPatientId = null;
        let currentImageBase64 = null;
        let currentSignatureBase64 = null;
        let stream = null; // Para el stream de la cámara

        const screens = {
            list: 'patient-list-screen',
            form: 'patient-form-screen',
            report: 'report-screen'
        };

        // --- Selectores del DOM ---
        const listScreen = document.getElementById(screens.list);
        const formScreen = document.getElementById(screens.form);
        const reportScreen = document.getElementById(screens.report);
        const patientListContainer = document.getElementById('patient-list-container');
        const formTitle = document.getElementById('form-title');
        const patientForm = document.getElementById('patient-form');
        const nameInput = document.getElementById('name');
        const idInput = document.getElementById('id');
        const historyInput = document.getElementById('history');
        const imageFileInput = document.getElementById('image-file-input');
        const uploadBtn = document.getElementById('upload-btn');
        const cameraBtn = document.getElementById('camera-btn');
        const imagePreview = document.getElementById('image-preview');
        const signatureFileInput = document.getElementById('signature-file-input');
        const signaturePreview = document.getElementById('signature-preview');
        const savePatientBtn = document.getElementById('save-patient-btn');
        const analyzeBtn = document.getElementById('analyze-btn');
        const cancelFormBtn = document.getElementById('cancel-form-btn');
        const searchInput = document.getElementById('search-input');
        const loadingOverlay = document.getElementById('loading-overlay');
        const reportImage = document.getElementById('report-image');
        const reportEditor = document.getElementById('report-editor');
        const reportPatientInfo = document.getElementById('report-patient-info');
        const exportPdfBtn = document.getElementById('export-pdf-btn');
        const backToListBtn = document.getElementById('back-to-list-btn');
        const cameraModal = document.getElementById('camera-modal');
        const videoStream = document.getElementById('video-stream');
        const captureBtn = document.getElementById('capture-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const messageModal = document.getElementById('message-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const closeCameraButton = document.getElementById('close-camera-btn');
        const newPatientBtn = document.getElementById('new-patient-btn');
        const themeToggle = document.getElementById('theme-toggle');
        const moonIcon = document.getElementById('moon-icon');
        const sunIcon = document.getElementById('sun-icon');


        // --- Funciones de Utilidad ---

        function showScreen(screenId) {
            listScreen.classList.add('hidden');
            formScreen.classList.add('hidden');
            reportScreen.classList.add('hidden');
            document.getElementById(screenId).classList.remove('hidden');
            document.getElementById(screenId).classList.add('block');
        }

        function showModal(title, message) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            messageModal.classList.remove('hidden');
            messageModal.classList.add('flex');
        }

        function closeCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            cameraModal.classList.add('hidden');
            cameraModal.classList.remove('flex');
        }


        // --- Persistencia de Datos (localStorage) ---

        function savePatients() {
            localStorage.setItem('colpoVisionPatients', JSON.stringify(patients));
        }

        function loadPatients() {
            const storedPatients = localStorage.getItem('colpoVisionPatients');
            if (storedPatients) {
                patients = JSON.parse(storedPatients);
            }
        }

        function renderPatientList() {
            patientListContainer.innerHTML = '';
            const searchText = searchInput.value.toLowerCase();
            const filteredPatients = patients.filter(p =>
                p.name.toLowerCase().includes(searchText) || p.id.toLowerCase().includes(searchText)
            );

            if (filteredPatients.length === 0) {
                document.getElementById('no-patients-message').classList.remove('hidden');
            } else {
                document.getElementById('no-patients-message').classList.add('hidden');
            }

            filteredPatients.forEach(patient => {
                const card = document.createElement('div');
                card.className = 'bg-white dark:bg-gray-800 p-5 rounded-lg shadow-md border border-gray-200 dark:border-gray-700 hover:shadow-lg transition duration-150 space-y-3';
                card.innerHTML = `
                    <h3 class="text-xl font-semibold text-gray-900 dark:text-white">${patient.name}</h3>
                    <p class="text-sm text-gray-600 dark:text-gray-400">ID: ${patient.id}</p>
                    <p class="text-sm text-gray-600 dark:text-gray-400">Historial: ${patient.history.substring(0, 100)}...</p>
                    <div class="flex flex-wrap gap-2 pt-2">
                        <button data-id="${patient.id}" class="edit-btn text-sm text-blue-600 hover:text-blue-800 font-medium">Editar</button>
                        ${patient.imageBase64 ? `<button data-id="${patient.id}" class="analyze-list-btn text-sm text-green-600 hover:text-green-800 font-medium">Analizar IA</button>` : `<span class="text-sm text-yellow-600">Sin imagen</span>`}
                        <button data-id="${patient.id}" class="delete-btn text-sm text-red-600 hover:text-red-800 font-medium">Eliminar</button>
                    </div>
                `;
                patientListContainer.appendChild(card);
            });
        }


        // --- Gestión de Formularios y Edición ---

        function resetForm() {
            patientForm.reset();
            editingPatientId = null;
            currentImageBase64 = null;
            currentSignatureBase64 = null;
            imagePreview.src = '';
            imagePreview.classList.add('hidden');
            signaturePreview.src = '';
            signaturePreview.classList.add('hidden');
            formTitle.textContent = 'Nueva Paciente';
            analyzeBtn.classList.add('hidden');
        }

        function fillForm(patient) {
            nameInput.value = patient.name;
            idInput.value = patient.id;
            historyInput.value = patient.history;
            currentImageBase64 = patient.imageBase64;
            currentSignatureBase64 = patient.signatureBase64;
            
            if (currentImageBase64) {
                imagePreview.src = `data:image/jpeg;base64,${currentImageBase64}`;
                imagePreview.classList.remove('hidden');
            } else {
                imagePreview.classList.add('hidden');
            }

            if (currentSignatureBase64) {
                signaturePreview.src = `data:image/png;base64,${currentSignatureBase64}`;
                signaturePreview.classList.remove('hidden');
            } else {
                signaturePreview.classList.add('hidden');
            }

            formTitle.textContent = 'Editar Paciente';
            analyzeBtn.classList.remove('hidden');
        }

        function getPatientById(id) {
            return patients.find(p => p.id === id);
        }

        // --- Event Handlers de Formularios ---

        newPatientBtn.addEventListener('click', () => {
            resetForm();
            showScreen(screens.form);
        });

        cancelFormBtn.addEventListener('click', () => {
            showScreen(screens.list);
            renderPatientList();
        });

        searchInput.addEventListener('input', renderPatientList);

        // Delegación de eventos para botones de lista (Editar/Eliminar)
        patientListContainer.addEventListener('click', (e) => {
            const target = e.target;
            const patientId = target.dataset.id;
            const patient = getPatientById(patientId);

            if (!patient) return;

            if (target.classList.contains('edit-btn')) {
                editingPatientId = patientId;
                fillForm(patient);
                showScreen(screens.form);
            } else if (target.classList.contains('delete-btn')) {
                if (confirm(`¿Estás seguro de eliminar el paciente ${patient.name}?`)) {
                    patients = patients.filter(p => p.id !== patientId);
                    savePatients();
                    renderPatientList();
                }
            } else if (target.classList.contains('analyze-list-btn')) {
                editingPatientId = patientId; // Cargar paciente para análisis
                // Ir directo al análisis si la imagen existe
                if (patient.imageBase64) {
                    analyzePatient(patient);
                } else {
                    showModal('Falta Imagen', 'El paciente no tiene una imagen colposcópica para analizar.');
                }
            }
        });

        savePatientBtn.addEventListener('click', () => {
            const name = nameInput.value.trim();
            const id = idInput.value.trim();
            const history = historyInput.value.trim();

            if (!name || !id) {
                showModal('Datos Incompletos', 'Por favor, introduce el Nombre Completo y el ID/Historia Clínica.');
                return;
            }

            const newPatient = {
                id: id,
                name: name,
                history: history,
                imageBase64: currentImageBase64,
                signatureBase64: currentSignatureBase64
            };

            if (editingPatientId) {
                const index = patients.findIndex(p => p.id === editingPatientId);
                if (index !== -1) {
                    patients[index] = newPatient;
                    showModal('Paciente Guardado', `Los datos de ${name} han sido actualizados.`);
                }
            } else {
                if (patients.some(p => p.id === id)) {
                    showModal('ID Duplicado', `Ya existe un paciente con el ID: ${id}. Por favor, usa otro ID o edita el paciente existente.`);
                    return;
                }
                patients.push(newPatient);
                showModal('Paciente Guardado', `${name} ha sido agregado a la lista.`);
            }

            savePatients();
            // Mantenerse en el formulario si se está editando para permitir análisis inmediato
            if (!editingPatientId) {
                showScreen(screens.list);
                renderPatientList();
            } else {
                // Actualizar el estado para el botón de análisis
                analyzeBtn.classList.remove('hidden');
            }
        });


        // --- Gestión de Archivos y Cámara ---

        function handleImageUpload(input, preview, type) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = e => {
                const base64Data = e.target.result;
                preview.src = base64Data;
                preview.classList.remove('hidden');
                
                // Base64 pura (sin el prefijo data:image/...)
                const base64Pure = base64Data.split(',')[1];
                
                if (type === 'colposcopic') {
                    currentImageBase64 = base64Pure;
                    // Muestra el botón de analizar si hay imagen y es un paciente guardado/editado
                    if (editingPatientId) analyzeBtn.classList.remove('hidden'); 
                } else if (type === 'signature') {
                    currentSignatureBase64 = base64Pure;
                }
            };
            reader.readAsDataURL(file);
        }

        uploadBtn.addEventListener('click', () => imageFileInput.click());
        imageFileInput.addEventListener('change', () => handleImageUpload(imageFileInput, imagePreview, 'colposcopic'));
        signatureFileInput.addEventListener('change', () => handleImageUpload(signatureFileInput, signaturePreview, 'signature'));

        // --- Control de la Cámara (Cámara Trasera por Defecto) ---
        cameraBtn.addEventListener('click', async () => {
            // 💡 CONFIGURACIÓN CLAVE: Restricciones para forzar la cámara trasera
            const constraints = { 
                video: {
                    facingMode: { exact: "environment" } // Prioriza la cámara trasera
                }, 
                audio: false 
            };

            try {
                // Intenta obtener la cámara trasera primero
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                
                videoStream.srcObject = stream;
                cameraModal.classList.remove('hidden');
                cameraModal.classList.add('flex');
            } catch (err) {
                // Si falla la cámara trasera, intenta con cualquier cámara disponible (ej. frontal)
                console.warn("Fallo al acceder a la cámara trasera. Intentando con cualquier cámara...", err);
                
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    videoStream.srcObject = stream;
                    cameraModal.classList.remove('hidden');
                    cameraModal.classList.add('flex');
                } catch (finalError) {
                    console.error("Error final al acceder a la cámara: ", finalError);
                    showModal('Error de Cámara', 'No se pudo acceder a ninguna cámara. Por favor, revisa los permisos del dispositivo.');
                }
            }
        });

        closeCameraButton.addEventListener('click', closeCamera);

        captureBtn.addEventListener('click', () => {
            const canvas = document.createElement('canvas');
            canvas.width = videoStream.videoWidth;
            canvas.height = videoStream.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(videoStream, 0, 0, canvas.width, canvas.height);

            const base64DataUrl = canvas.toDataURL('image/jpeg');
            currentImageBase64 = base64DataUrl.split(',')[1]; // Base64 pura

            imagePreview.src = base64DataUrl;
            imagePreview.classList.remove('hidden');
            
            closeCamera();
            
            // Muestra el botón de analizar si hay imagen y es un paciente guardado/editado
            if (editingPatientId) analyzeBtn.classList.remove('hidden');
        });


        // --- Gestión de la API de Gemini ---

        analyzeBtn.addEventListener('click', async () => {
            if (!currentImageBase64) {
                showModal('Falta Imagen', 'Por favor, sube o captura una imagen colposcópica antes de analizar.');
                return;
            }

            const patient = getPatientById(editingPatientId);
            if (!patient) return;
            
            analyzePatient(patient);
        });

        async function analyzePatient(patient) {
            loadingOverlay.classList.remove('hidden');

            const prompt = `Eres un asistente de IA para médicos especializados en Colposcopia. Tu tarea es analizar la imagen colposcópica proporcionada junto con el historial médico del paciente y generar un informe colposcópico profesional.

Instrucciones:
1.  **Analiza la Imagen:** Evalúa la lesión, la zona de transformación (ZT), el epitelio aceto-blanco, los vasos sanguíneos y los patrones.
2.  **Utiliza el Historial:** Incorpora los datos proporcionados en el historial médico para contextualizar tu análisis.
3.  **Formato del Informe:** Genera una respuesta SÓLO con el informe, usando títulos claros y formato de lista. El informe debe ser exhaustivo y profesional.
4.  **No incluyas la clave API ni menciones que eres una IA.**

Historial del Paciente:
* Nombre: ${patient.name}
* ID: ${patient.id}
* Historial Médico: ${patient.history || 'No se proporcionó historial relevante.'}

Genera el informe Colposcópico ahora.`;

            const payload = {
                contents: [
                    {
                        role: "user",
                        parts: [
                            { text: prompt },
                            {
                                inlineData: {
                                    mimeType: "image/jpeg",
                                    data: patient.imageBase64 // Imagen Base64
                                }
                            }
                        ]
                    }
                ],
            };

            // 💡 CAMBIO CLAVE: Llama a la Vercel Serverless Function, no a Google directamente
            const apiUrl = "/api/generate"; 
            const maxRetries = 3;
            let retries = 0;
            let success = false;
            let finalData = null;

            while (retries < maxRetries && !success) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            // Ya no se envía la clave API aquí. Vercel la inyecta en el backend.
                        },
                        body: JSON.stringify(payload)
                    });

                    finalData = await response.json();

                    if (response.ok) {
                        success = true;
                    } else if (response.status === 429) { // Manejo de Too Many Requests
                        retries++;
                        const delay = 1000;
                        await new Promise(resolve => setTimeout(resolve, delay * Math.pow(2, retries)));
                    } else {
                        throw new Error(finalData.error?.message || `Error de la API: ${response.status}`);
                    }

                } catch (error) {
                    retries++;
                    console.error(`Intento ${retries} fallido:`, error);
                    if (retries >= maxRetries) {
                        showModal('Error de Análisis', `No se pudo generar el informe después de ${maxRetries} intentos. Revisa tu clave API o inténtalo más tarde. Detalle: ${error.message}`);
                    }
                }
            }

            loadingOverlay.classList.add('hidden');

            if (success && finalData && finalData.candidates && finalData.candidates.length > 0) {
                const reportText = finalData.candidates[0].content.parts[0].text;
                
                // Llenar pantalla de informe
                reportEditor.textContent = reportText;
                reportImage.src = `data:image/jpeg;base64,${patient.imageBase64}`;
                reportPatientInfo.innerHTML = `
                    <p><strong>Paciente:</strong> ${patient.name}</p>
                    <p><strong>ID:</strong> ${patient.id}</p>
                    <p><strong>Historial:</strong> ${patient.history || 'No proporcionado'}</p>
                    <p><strong>Fecha del Informe:</strong> ${new Date().toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
                `;

                showScreen(screens.report);

            } else if (!success) {
                // El mensaje de error ya fue mostrado dentro del bucle
            } else {
                showModal('Error de Respuesta', 'La IA no pudo generar un informe válido. Intenta con una imagen más clara o revisa el historial.');
            }
        }


        // --- Exportación a PDF (jsPDF) ---

        exportPdfBtn.addEventListener('click', () => {
            const patient = getPatientById(editingPatientId);
            if (!patient) {
                showModal('Error', 'No se encontró el paciente para exportar.');
                return;
            }

            const doc = new jsPDF('p', 'mm', 'a4');
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            const margin = 15;
            let currentY = margin;
            const textWidth = pageWidth - 2 * margin;

            // Configuración de estilos
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(30, 30, 30); // Negro oscuro

            // Función auxiliar para cargar imagen (promisificada)
            const loadImage = (base64, mimeType = 'image/jpeg') => {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = `${mimeType === 'image/png' ? 'data:image/png' : 'data:image/jpeg'};base64,${base64}`;
                });
            };

            // 1. Título
            doc.setFontSize(16);
            doc.setFont('helvetica', 'bold');
            doc.text("INFORME COLPOSCÓPICO - COLPOVISION AI", pageWidth / 2, currentY, { align: 'center' });
            currentY += 10;
            
            // Línea separadora
            doc.setDrawColor(200, 200, 200);
            doc.line(margin, currentY, pageWidth - margin, currentY);
            currentY += 5;

            // 2. Información del Paciente
            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            doc.text(`Paciente: ${patient.name}`, margin, currentY);
            doc.text(`ID/Historia Clínica: ${patient.id}`, pageWidth / 2, currentY);
            currentY += 5;
            doc.text(`Fecha del Informe: ${new Date().toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' })}`, margin, currentY);
            currentY += 5;
            
            // Historial
            const historyText = `Historial: ${patient.history || 'No proporcionado'}`;
            const historyLines = doc.splitTextToSize(historyText, textWidth);
            doc.text(historyLines, margin, currentY);
            currentY += (historyLines.length * 4) + 5; 
            
            // Línea separadora
            doc.line(margin, currentY, pageWidth - margin, currentY);
            currentY += 5;

            // 3. Imagen Colposcópica
            doc.setFontSize(14);
            doc.setFont('helvetica', 'bold');
            doc.text("Imagen Colposcópica", margin, currentY);
            currentY += 5;

            const imageY = currentY;
            const imageX = margin;
            const imageWidth = 70; // Ancho fijo para la imagen
            const maxHeight = 70;

            if (patient.imageBase64) {
                loadImage(patient.imageBase64, 'image/jpeg').then(img => {
                    let imageHeight = (img.height * imageWidth) / img.width;
                    if (imageHeight > maxHeight) {
                        imageHeight = maxHeight;
                    }
                    doc.addImage(img, 'JPEG', imageX, imageY, imageWidth, imageHeight);
                    return imageY + imageHeight + 10; // Devuelve la nueva Y después de la imagen
                }).then(newY => {
                    currentY = newY;
                    
                    // 4. Contenido del Informe AI
                    doc.setFontSize(14);
                    doc.setFont('helvetica', 'bold');
                    doc.text("Análisis e Informe de IA (Editable)", margin, currentY);
                    currentY += 5;

                    // Función para agregar texto con paginación
                    const addTextWithPagination = (text, startY) => {
                        let y = startY;
                        const lines = text.split('\n');

                        doc.setFontSize(10);
                        doc.setFont('helvetica', 'normal');
                        doc.setTextColor(50, 50, 50); // Gris más oscuro para el cuerpo
                        
                        lines.forEach(line => {
                            let fontStyle = 'normal';
                            if (line.trim().endsWith(':') || line.trim().endsWith('.')) { // Heurística para títulos de sección
                                doc.setFont('helvetica', 'bold');
                                doc.setFontSize(12);
                                doc.setTextColor(30, 30, 30);
                            } else if (line.trim().startsWith('-')) {
                                doc.setFont('helvetica', 'normal');
                                doc.setFontSize(10);
                                doc.setTextColor(50, 50, 50);
                            } else {
                                doc.setFont('helvetica', 'normal');
                                doc.setFontSize(10);
                                doc.setTextColor(50, 50, 50);
                            }

                            const textLines = doc.splitTextToSize(line, textWidth);

                            textLines.forEach(tline => {
                                if (y > pageHeight - margin - 20) { // Comprueba si necesita nueva página (reservando espacio para el pie)
                                    doc.addPage();
                                    y = margin;
                                }
                                doc.text(tline, margin, y);
                                y += 5; // Salto de línea
                            });
                            
                            // Restablece el estilo de fuente después de la línea
                            doc.setFont('helvetica', 'normal'); 
                            doc.setFontSize(10);
                        });
                        return y;
                    };

                    const finalReportText = reportEditor.textContent || reportEditor.innerText;
                    currentY = addTextWithPagination(finalReportText, currentY);
                    
                    // 5. Espacio para Firma (Pie de Página)
                    let footerY = pageHeight - margin - 20;

                    // Línea horizontal para la firma
                    doc.setDrawColor(50, 50, 50);
                    doc.setFontSize(10);
                    doc.setTextColor(80, 80, 80);
                    const signatureText = 'Firma del Especialista';
                    const signatureAreaWidth = 60;
                    const signatureAreaX = pageWidth - margin - signatureAreaWidth;
                    
                    if (patient.signatureBase64) {
                        loadImage(patient.signatureBase64, 'image/png').then(signatureImg => {
                            const signatureImgWidth = 50;
                            const signatureImgHeight = 20;
                            doc.addImage(signatureImg, 'PNG', signatureAreaX + (signatureAreaWidth - signatureImgWidth) / 2, footerY - signatureImgHeight, signatureImgWidth, signatureImgHeight);
                            doc.text('_________________________________', signatureAreaX + (signatureAreaWidth / 2), footerY, { align: 'center' });
                            doc.text(signatureText, signatureAreaX + (signatureAreaWidth / 2), footerY + 5, { align: 'center' });
                        }).catch(error => {
                            console.error("Error al cargar la imagen de firma para PDF:", error);
                            doc.text('_________________________________', signatureAreaX + (signatureAreaWidth / 2), footerY, { align: 'center' });
                            doc.text(signatureText, signatureAreaX + (signatureAreaWidth / 2), footerY + 5, { align: 'center' });
                        }).finally(() => {
                            doc.save(`Informe_ColpoVision_${patient.name}.pdf`);
                            showModal('PDF Exportado', 'El informe se ha exportado a PDF correctamente.');
                        });
                    } else {
                        doc.text('_________________________________', signatureAreaX + (signatureAreaWidth / 2), footerY, { align: 'center' });
                        doc.text(signatureText, signatureAreaX + (signatureAreaWidth / 2), footerY + 5, { align: 'center' });
                        doc.save(`Informe_ColpoVision_${patient.name}.pdf`);
                        showModal('PDF Exportado', 'El informe se ha exportado a PDF correctamente.');
                    }
                });
            } else {
                // Si no hay imagen, salta la sección de imagen y continúa con el informe
                doc.setFontSize(14);
                doc.setFont('helvetica', 'bold');
                doc.text("Análisis e Informe de IA (Editable)", margin, currentY);
                currentY += 5;

                // Continuar la lógica de paginación de texto aquí...
                const addTextWithPagination = (text, startY) => {
                    let y = startY;
                    const lines = text.split('\n');

                    doc.setFontSize(10);
                    doc.setFont('helvetica', 'normal');
                    doc.setTextColor(50, 50, 50);
                    
                    lines.forEach(line => {
                        let fontStyle = 'normal';
                        if (line.trim().endsWith(':') || line.trim().endsWith('.')) {
                            doc.setFont('helvetica', 'bold');
                            doc.setFontSize(12);
                            doc.setTextColor(30, 30, 30);
                        } else if (line.trim().startsWith('-')) {
                            doc.setFont('helvetica', 'normal');
                            doc.setFontSize(10);
                            doc.setTextColor(50, 50, 50);
                        } else {
                            doc.setFont('helvetica', 'normal');
                            doc.setFontSize(10);
                            doc.setTextColor(50, 50, 50);
                        }

                        const textLines = doc.splitTextToSize(line, textWidth);

                        textLines.forEach(tline => {
                            if (y > pageHeight - margin - 20) {
                                doc.addPage();
                                y = margin;
                            }
                            doc.text(tline, margin, y);
                            y += 5;
                        });
                        
                        doc.setFont('helvetica', 'normal'); 
                        doc.setFontSize(10);
                    });
                    return y;
                };

                const finalReportText = reportEditor.textContent || reportEditor.innerText;
                currentY = addTextWithPagination(finalReportText, currentY);
                
                // 5. Espacio para Firma (Pie de Página)
                let footerY = pageHeight - margin - 20;

                // Línea horizontal para la firma
                doc.setDrawColor(50, 50, 50);
                doc.setFontSize(10);
                doc.setTextColor(80, 80, 80);
                const signatureText = 'Firma del Especialista';
                const signatureAreaWidth = 60;
                const signatureAreaX = pageWidth - margin - signatureAreaWidth;

                if (patient.signatureBase64) {
                    loadImage(patient.signatureBase64, 'image/png').then(signatureImg => {
                        const signatureImgWidth = 50;
                        const signatureImgHeight = 20;
                        doc.addImage(signatureImg, 'PNG', signatureAreaX + (signatureAreaWidth - signatureImgWidth) / 2, footerY - signatureImgHeight, signatureImgWidth, signatureImgHeight);
                        doc.text('_________________________________', signatureAreaX + (signatureAreaWidth / 2), footerY, { align: 'center' });
                        doc.text(signatureText, signatureAreaX + (signatureAreaWidth / 2), footerY + 5, { align: 'center' });
                    }).catch(error => {
                        console.error("Error al cargar la imagen de firma para PDF:", error);
                        doc.text('_________________________________', signatureAreaX + (signatureAreaWidth / 2), footerY, { align: 'center' });
                        doc.text(signatureText, signatureAreaX + (signatureAreaWidth / 2), footerY + 5, { align: 'center' });
                    }).finally(() => {
                        doc.save(`Informe_ColpoVision_${patient.name}.pdf`);
                        showModal('PDF Exportado', 'El informe se ha exportado a PDF correctamente.');
                    });
                } else {
                    doc.text('_________________________________', signatureAreaX + (signatureAreaWidth / 2), footerY, { align: 'center' });
                    doc.text(signatureText, signatureAreaX + (signatureAreaWidth / 2), footerY + 5, { align: 'center' });
                    doc.save(`Informe_ColpoVision_${patient.name}.pdf`);
                    showModal('PDF Exportado', 'El informe se ha exportado a PDF correctamente.');
                }
            }
        });

        // --- Gestión del Tema (Modo Oscuro) ---
        function applySavedTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                moonIcon.classList.add('hidden');
                sunIcon.classList.remove('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                moonIcon.classList.remove('hidden');
                sunIcon.classList.add('hidden');
            }
        }

        themeToggle.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                moonIcon.classList.remove('hidden');
                sunIcon.classList.add('hidden');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                moonIcon.classList.add('hidden');
                sunIcon.classList.remove('hidden');
            }
        });


        // --- Inicialización ---
        window.onload = () => {
            // Event Listener para cerrar modal de mensajes
            closeModalBtn.addEventListener('click', () => {
                messageModal.classList.add('hidden');
                messageModal.classList.remove('flex');
            });
            
            applySavedTheme();
            loadPatients();
            renderPatientList();
            showScreen(screens.list);
        };
    </script>
